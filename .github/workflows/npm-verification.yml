name: Verify npm publishing prerequisites
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.9.0
      - name: Read publishing configuration and authentication status
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          for(const key of ['dry-run','registry','access','provenance']) {
            const r=spawnSync('npm',['config','get',key],{encoding:'utf8'});
            console.log({configuration:key,status:r.status,value:r.stdout.trim()});
          }
          const identity=spawnSync('npm',['whoami','--json','--registry','https://registry.npmjs.org/'],{encoding:'utf8'});
          let identityError;try{identityError=JSON.parse(identity.stdout).error?.code;}catch{}
          console.log({authenticated:identity.status===0,error:/^E(?:401|403|404|OTP|NEEDAUTH)$/.test(identityError||'')?identityError:undefined});
          const read=spawnSync('npm',['view','@knights-eye-chess/game-tree@0.1.0-dev.8','--json','--registry','https://registry.npmjs.org/','--prefer-online'],{encoding:'utf8'});
          let data;try{data=JSON.parse(read.stdout);}catch{}
          console.log({registryReadStatus:read.status,name:data?.name,version:data?.version,integrity:data?.dist?.integrity,error:data?.error?.code});
          JS
